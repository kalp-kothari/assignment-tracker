<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Assignment Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --paper: #FBF6ED;
            --paper-line: #E7DFCF;
            --ink: #24262B;
            --ink-soft: #6B6656;
            --navy: #26314F;
            --navy-dark: #1B2438;
            --coral: #FF6B52;
            --coral-dark: #E5533B;
            --sunflower: #FFC145;
            --mint: #2FBE8F;
            --card-shadow: 0 2px 0 var(--paper-line), 0 10px 24px rgba(38, 49, 79, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--paper);
            background-image:
                linear-gradient(var(--paper-line) 1px, transparent 1px);
            background-size: 100% 42px;
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        h1, h2, h3, h4, .navbar-brand, .btn, label, th {
            font-family: 'Fredoka', sans-serif;
        }

        a { color: var(--coral-dark); }

        /* Navbar */
        .navbar {
            background: var(--navy) !important;
            border-bottom: 4px solid var(--coral);
            padding: 0.9rem 0;
        }
        .navbar-brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: #FBF6ED !important;
            letter-spacing: 0.3px;
        }
        .navbar-text { font-family: 'Inter', sans-serif; color: #C9D0E0 !important; }

        /* Buttons */
        .btn { font-weight: 600; border-radius: 8px; border-width: 2px; transition: transform 0.12s ease; }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--coral); border-color: var(--coral); color: #fff;
        }
        .btn-primary:hover { background: var(--coral-dark); border-color: var(--coral-dark); }
        .btn-outline-light { border-color: #C9D0E0; color: #FBF6ED; }
        .btn-outline-light:hover { background: var(--coral); border-color: var(--coral); }
        .btn-outline-secondary.active, .btn-outline-secondary:hover {
            background: var(--navy); border-color: var(--navy); color: #fff;
        }
        .btn-outline-secondary { color: var(--navy); border-color: var(--navy); }
        .btn-outline-success { color: var(--mint); border-color: var(--mint); }
        .btn-outline-success:hover { background: var(--mint); border-color: var(--mint); color: #fff; }
        .btn-outline-primary { color: var(--navy); border-color: var(--navy); }
        .btn-outline-primary:hover { background: var(--navy); border-color: var(--navy); }
        .btn-outline-danger:hover { background: var(--coral-dark); border-color: var(--coral-dark); }

        /* Cards */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }
        .card-body { padding: 1.75rem; }
        .card-title { font-weight: 600; color: var(--navy); }

        /* Alerts */
        .alert { border: none; border-radius: 10px; border-left: 5px solid; font-family: 'Inter', sans-serif; }
        .alert-success { background: #E3F7EE; border-color: var(--mint); color: #1B7A56; }
        .alert-danger { background: #FDE9E5; border-color: var(--coral); color: #B23B26; }
        .alert-info { background: #EAF0FB; border-color: var(--navy); color: var(--navy); }

        /* Inputs */
        .form-control, .form-select {
            border: 2px solid var(--paper-line);
            border-radius: 8px;
            padding: 0.55rem 0.75rem;
            background: #fff;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--coral);
            box-shadow: 0 0 0 3px rgba(255, 107, 82, 0.18);
        }
        label.form-label { color: var(--navy); font-weight: 600; font-size: 0.95rem; }

        footer.tracker-footer {
            text-align: center;
            color: var(--ink-soft);
            font-size: 0.85rem;
            padding: 2.5rem 0 1.5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand">
        <div class="container">
            <a class="navbar-brand" href="{% url 'assignment_list' %}">📚 Assignment Tracker</a>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Hi, {{ user.username }} 👋</span>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
                    <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <footer class="tracker-footer">Stay on top of it. One assignment at a time.</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
