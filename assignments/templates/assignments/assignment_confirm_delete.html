{% extends "base.html" %}
{% block title %}Delete Assignment{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card" style="border-top: 5px solid var(--coral-dark);">
            <div class="card-body">
                <h4 class="card-title mb-3">Delete "{{ assignment.title }}"?</h4>
                <p style="color: var(--ink-soft);">This can't be undone — the assignment will be gone for good.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary" style="background: var(--coral-dark); border-color: var(--coral-dark);">Yes, delete it</button>
                    <a href="{% url 'assignment_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
