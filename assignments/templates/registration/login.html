{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card" style="border-top: 5px solid var(--navy);">
            <div class="card-body">
                <h4 class="card-title mb-1">Welcome back</h4>
                <p class="mb-3" style="color: var(--ink-soft);">Log in to see your assignments.</p>
                <form method="post">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger">That username or password doesn't match.</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="mt-3 mb-0 text-center" style="color: var(--ink-soft);">
                    No account? <a href="{% url 'signup' %}">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
